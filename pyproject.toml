[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "klm-conformance"
version = "0.1.0"
description = "KLM (Knowledge Layers Model) conformance toolchain — validators, signed envelopes, hash-chained logs, disclosure views. Stdlib-only."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
# Deliberately empty: third-party verification must need nothing but Python.
dependencies = []

[project.urls]
Specification = "https://github.com/omasim/KLM"
Changelog = "https://github.com/omasim/KLM/blob/main/CHANGELOG.md"

[project.scripts]
klm-validate = "klm_conformance.validate_attestation:cli"
klm-validate-gamma = "klm_conformance.validate_gamma:cli"
klm-sign = "klm_conformance.sign_attestation:cli"
klm-log = "klm_conformance.attestation_log:cli"
klm-disclose = "klm_conformance.disclosure:cli"

# Modules ship under the klm_conformance namespace — never as bare
# top-level modules (generic names like `disclosure` would collide in
# user environments).
[tool.hatch.build.targets.wheel]
packages = ["schema"]

[tool.hatch.build.targets.wheel.sources]
"schema" = "klm_conformance"
